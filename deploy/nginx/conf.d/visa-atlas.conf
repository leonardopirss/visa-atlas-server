upstream visa_atlas_api {
  zone visa_atlas_api 64k;
  server api-1:3000 max_fails=2 fail_timeout=5s;
  server api-2:3000 max_fails=2 fail_timeout=5s;
  keepalive 32;
}

server {
  listen 8080 default_server;
  server_name _;

  limit_req_status 429;
  limit_req zone=visa_atlas_per_ip burst=10 nodelay;
  limit_req zone=visa_atlas_per_host burst=50 nodelay;

  client_max_body_size 1k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  send_timeout 15s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
  }
  if ($request_has_body) {
    return 413;
  }
  if ($request_has_transfer_encoding) {
    return 413;
  }

  location / {
    proxy_pass http://visa_atlas_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 1s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_set_header Connection "";
    proxy_set_header Proxy "";

    proxy_hide_header X-Powered-By;
  }
}
