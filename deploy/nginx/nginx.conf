worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;

  client_header_buffer_size 1k;
  large_client_header_buffers 2 8k;
  client_body_buffer_size 1k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  reset_timedout_connection on;

  log_format visa_atlas_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"requestId":"$correlation_id",'
    '"remoteAddress":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"requestTime":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamTime":"$upstream_response_time"}';
  access_log /dev/stdout visa_atlas_json;

  map $http_x_correlation_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
  }

  map $http_content_length $request_has_body {
    default 1;
    "" 0;
    "0" 0;
  }

  map $http_transfer_encoding $request_has_transfer_encoding {
    default 1;
    "" 0;
  }

  limit_req_zone $binary_remote_addr zone=visa_atlas_per_ip:10m rate=5r/s;
  limit_req_zone $server_name zone=visa_atlas_per_host:10m rate=100r/s;

  include /etc/nginx/conf.d/*.conf;
}
