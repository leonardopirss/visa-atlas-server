name: API CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: visa_atlas_test
          POSTGRES_USER: visa_atlas
          POSTGRES_PASSWORD: visa_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U visa_atlas -d visa_atlas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://visa_atlas:visa_atlas@localhost:5432/visa_atlas_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Supabase migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: 0.4.61
      - name: Deploy immutable revision to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test public API
        if: ${{ vars.API_SMOKE_URL != '' }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$API_SMOKE_URL" > /dev/null
        env:
          API_SMOKE_URL: ${{ vars.API_SMOKE_URL }}
